{% extends 'base.html' %}

{% block title %}Sem cartoes{% endblock %}

{% block content %}
<section class="empty-state">
    <p class="eyebrow">Sessão concluída</p>
    <h1>{{ title|default:'Nenhuma frase para revisar agora.' }}</h1>
    <p class="muted">{{ message|default:'O sistema vai liberar as próximas frases quando chegar a hora certa.' }}</p>
    <a class="button secondary" href="{% url 'dashboard' %}">Voltar ao dashboard</a>
</section>
{% endblock %}
