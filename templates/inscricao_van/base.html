{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Inscricao Van{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'inscricao_van/van.css' %}">
</head>
<body>
    {% if messages %}
        <div class="van-messages">
            {% for message in messages %}
                <p class="van-message {{ message.tags }}">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
